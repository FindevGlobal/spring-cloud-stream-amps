spring.cloud:
  stream:
    amps:
      binder:
        brokers: localhost
      bindings:
        input1-in-0:
          consumer:
            snapshot: true
            rate: 10
            withTimestamp: true
            ackBatchSize: 100
            ackTimeout: 100s
            heartbeat: 200s
            timeout: 300s
            bookmarkType: MOST_RECENT
            filter: filter
            options:
              - op1
              - op2
            maxBacklog: 200
            batchSize: 50
        input2-in-0:
          consumer:
            bookmarkProviderBeanName: customBookMarkProvider
    bindings:
      input1-in-0:
        destination: topic1
      input2-in-0:
        destination: topic2
  function:
    definition: input1;input2